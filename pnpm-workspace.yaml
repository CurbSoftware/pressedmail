packages:
  - 'apps/*'
  - 'packages/*'
  - 'tooling/*'

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  core-js: true
  core-js-pure: true
  esbuild: true
  # Optional native accelerator for msgpackr (pulled in via Excalidraw).
  # msgpackr falls back to its JS path, so there is nothing to gain from
  # compiling it and one less native build script in every install.
  msgpackr-extract: false
  msw: true
  sharp: true
  supabase: true
  unrs-resolver: true
  workerd: true

catalog:
  '@aws-sdk/client-s3': 3.1086.0
  '@aws-sdk/s3-request-presigner': 3.1086.0
  '@cloudflare/vitest-pool-workers': 0.18.4
  '@eslint/js': 10.0.1
  '@marsidev/react-turnstile': 1.6.0
  '@next/bundle-analyzer': 16.1.6
  '@next/eslint-plugin-next': 16.1.6
  '@platejs/ai': 53.0.9
  '@platejs/autoformat': 53.0.0
  '@platejs/basic-nodes': 53.0.0
  '@platejs/basic-styles': 53.0.0
  '@platejs/callout': 53.0.0
  '@platejs/caption': 53.0.0
  '@platejs/code-block': 53.0.0
  '@platejs/combobox': 53.0.0
  '@platejs/code-drawing': 53.0.0
  '@platejs/comment': 53.0.0
  '@platejs/core': 53.0.7
  '@platejs/date': 53.0.0
  '@platejs/dnd': 53.0.0
  '@platejs/docx': 53.0.0
  '@platejs/docx-io': 53.0.8
  '@platejs/emoji': 53.0.0
  '@platejs/excalidraw': 53.0.0
  '@platejs/floating': 53.0.0
  '@platejs/footnote': 53.0.0
  '@platejs/indent': 53.0.0
  '@platejs/juice': 53.0.0
  '@platejs/layout': 53.0.0
  '@platejs/link': 53.0.3
  '@platejs/list': 53.0.2
  '@platejs/markdown': 53.0.4
  '@platejs/math': 53.0.0
  '@platejs/media': 53.1.4
  '@platejs/mention': 53.0.0
  '@platejs/resizable': 53.0.0
  '@platejs/selection': 53.0.0
  '@platejs/slash-command': 53.0.0
  '@platejs/suggestion': 53.0.3
  '@platejs/table': 53.0.9
  '@platejs/toc': 53.0.0
  '@platejs/toggle': 53.0.0
  '@platejs/utils': 53.0.7
  '@platejs/yjs': 53.0.0
  '@react-email/components': 1.0.8
  '@sentry/nextjs': 10.40.0
  '@stripe/react-stripe-js': 6.4.0
  '@stripe/stripe-js': 9.6.0
  '@supabase/ssr': 0.9.0
  '@supabase/supabase-js': 2.100.0
  '@tailwindcss/postcss': 4.2.1
  '@tailwindcss/vite': 4.2.1
  '@tanstack/react-query': 5.90.21
  '@types/eslint': 9.6.1
  '@types/node': 25.3.1
  '@types/nodemailer': 7.0.11
  '@types/react': 19.2.14
  '@types/react-dom': 19.2.3
  '@wordpress/i18n': 5.12.0
  i18next: 25.8.13
  jose: 6.1.3
  eslint: 10.0.1
  eslint-config-next: 16.1.6
  eslint-config-turbo: 2.8.11
  lucide-react: 0.575.0
  mysql2: 3.23.2
  next: 16.1.6
  next-intl: ^4.8.3
  next-safe-action: ^8.1.3
  next-runtime-env: 3.3.0
  nodemailer: 8.0.1
  pino: 10.3.1
  platejs: 53.0.7
  react: 19.2.4
  react-dom: 19.2.4
  react-hook-form: 7.71.2
  react-i18next: 16.5.4
  stripe: 22.4.0
  supabase: 2.76.15
  tailwindcss: 4.2.1
  tsup: 8.5.1
  tw-animate-css: 1.4.0
  typescript: 5.9.3
  zod: 4.3.6
  wrangler: 4.110.0

overrides:
  '@types/react': 19.2.14
  '@types/react-dom': 19.2.3
  # Exact pins inside the excalidraw tree leave no in-range fix for these
  # advisories (GHSA-28wg, GHSA-xwg4, GHSA-55q2). mermaid 10.9.5+ itself
  # widened its dompurify range to ^3.2.4.
  '@excalidraw/excalidraw>nanoid': 3.3.19
  '@excalidraw/mermaid-to-excalidraw>nanoid': 5.1.16
  'mermaid@10>dompurify': 3.4.15

packageExtensions:
  '@hookform/resolvers@5.2.2':
    peerDependencies:
      zod: '^3.25.0 || ^4.0.0'

patchedDependencies:
  # 53.0.7 calls conditional mark renderers directly, changing Slate's hook order.
  # Mount each renderer as a component until the upstream fix is in our catalog.
  '@platejs/core@53.0.7': patches/@platejs__core@53.0.7.patch
